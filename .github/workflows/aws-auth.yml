name: Verify QSB AWS identity
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # The repository is public: the role, account and caller identity stay out of the log
      # (terraform/scripts/github_deploy.py credentials masks everything STS returns).
      - name: Assume the deploy role
        env:
          ROLE_ARN: ${{ secrets.QSB_AWS_ROLE_ARN }}
          ACCOUNT_ID: ${{ secrets.QSB_AWS_ACCOUNT_ID }}
          REGION: ${{ vars.QSB_AWS_REGION }}
        run: python3 terraform/scripts/github_deploy.py credentials "qsb-auth-$GITHUB_RUN_ID"
      - name: Check the session
        run: |
          aws sts get-caller-identity --query Arn --output text > "$RUNNER_TEMP/caller" 2>&1 \
            || { python3 terraform/scripts/github_deploy.py redact < "$RUNNER_TEMP/caller"; exit 1; }
          grep -q ':assumed-role/qsb-github-deploy/' "$RUNNER_TEMP/caller"
          echo "Authenticated as qsb-github-deploy."
