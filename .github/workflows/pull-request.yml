name: Typecheck and test
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  typecheck-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - name: Verify app vendoring excludes solver sources
        run: |
          python3 - <<'PYTHON'
          import json
          import pathlib
          import subprocess
          root = pathlib.Path('.')
          assert not (root / 'vendor/challenge').exists(), 'Challenge sources belong in qsb-solver'
          assert not (root / 'research/optimized-subset').exists(), 'Optimized CUDA belongs in qsb-solver'
          source = root / 'vendor/qsb'
          scope = json.loads((source / '.scope').read_text())
          expected = set(scope['files']) | {'.commit', '.scope'}
          actual = {str(p.relative_to(source)) for p in source.rglob('*') if p.is_file()}
          assert actual == expected, f'Unexpected vendored files: {actual ^ expected}'
          assert all(p == 'LICENSE' or p.endswith('.py') for p in scope['files']), 'Only generator/reference Python and license may be fetched'
          tracked_cuda = subprocess.check_output(['git', 'ls-files', '*.cu', '*.cuh'], text=True)
          assert not tracked_cuda.strip(), f'CUDA source remains in app: {tracked_cuda}'
          assert (root / 'worker/cpu/verify_hit.py').is_file(), 'Independent CPU verification must remain'
          PYTHON
      - name: Fail if vendoring changed tracked files
        run: git diff --exit-code
      - run: npm run typecheck
      - run: npm test -- --no-file-parallelism
      - name: Build coordinator deployment artifacts
        run: node terraform/scripts/build.mjs --network=mainnet
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false
      - name: Validate single-pipeline Terraform without AWS credentials
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform validate
          terraform -chdir=terraform test -json -verbose -var="source_commit=$(git rev-parse HEAD)" > /tmp/qsb-terraform-test.jsonl
          python3 terraform/tests/check-single-pipeline.py /tmp/qsb-terraform-test.jsonl
          python3 terraform/tests/check-single-pipeline.py
          python3 ops/github-aws/test_render.py
