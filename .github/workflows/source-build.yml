name: Rebuild optimized artifacts
on:
  workflow_dispatch:
    inputs:
      export_images:
        description: Export built images for isolated release validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:runtime && npm run test:runtime-build
      - run: npm run build:optimized && npm run test:optimized-image
      - run: npm run build:optimized:queue
      - name: Save public build receipt
        run: docker run --rm --network none --read-only --entrypoint cat qsb-optimized:source-v1 /opt/qsb-validation/build-receipt.json > solver-build-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-source-build
          path: |
            supervised/runtime/runtime.tar.gz
            supervised/runtime/dist/manifest.json
            solver-build-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Export validation artifacts
        if: inputs.export_images
        run: |
          mkdir -p validation-artifacts
          container=$(docker create qsb-optimized:source-v1)
          docker cp "$container:/opt/qsb-validation" validation-artifacts/runtime
          docker rm "$container"
          docker image inspect qsb-optimized:source-v1 qsb-optimized-queue:source-v1 > validation-artifacts/docker-images.json
          tar -C validation-artifacts -czf validation-artifacts/runtime-files.tar.gz runtime
          rm -rf validation-artifacts/runtime
          docker save qsb-optimized:source-v1 qsb-optimized-queue:source-v1 | gzip -1 > validation-artifacts/images.tar.gz
          (cd validation-artifacts && sha256sum runtime-files.tar.gz images.tar.gz docker-images.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.export_images
        with:
          name: isolated-validation-images
          path: validation-artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
