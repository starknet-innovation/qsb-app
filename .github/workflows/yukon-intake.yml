name: Yukon candidate intake
on:
  pull_request:
    paths:
      - 'scripts/yukon/**'
      - 'research/yukon-intake/**'
      - '.github/workflows/yukon-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
      - run: python3 -m unittest discover -s scripts/yukon -p 'test_*.py'
      - run: python3 scripts/yukon/validate.py --out /tmp/yukon-intake
      - name: Compile locked upstream sources without running them
        run: |
          docker build -f scripts/yukon/Dockerfile.compile -t qsb-yukon-intake:compile /tmp/yukon-intake
          docker run --rm --network none --read-only qsb-yukon-intake:compile > /tmp/yukon-intake/compile-receipt.txt
      - name: Validate isolated pinning repair
        run: |
          python3 scripts/yukon/adapt_pin.py --source /tmp/yukon-intake/source --out /tmp/yukon-pin-repair
          python3 scripts/yukon/test_pin_repair.py /tmp/yukon-pin-repair/pinning/pinning.cu > /tmp/yukon-intake/pin-repair-host.json
          cp /tmp/yukon-pin-repair/adaptation.json /tmp/yukon-intake/pin-repair-source.json
          docker build -f scripts/yukon/Dockerfile.pin-repair -t qsb-yukon-pin-repair:compile /tmp/yukon-pin-repair
          docker run --rm --network none --read-only qsb-yukon-pin-repair:compile > /tmp/yukon-intake/pin-repair-compile.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yukon-intake-evidence
          path: |
            /tmp/yukon-intake/result.json
            /tmp/yukon-intake/compile-receipt.txt
            /tmp/yukon-intake/pin-repair-*
          if-no-files-found: warn
